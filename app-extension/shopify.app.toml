# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = ""
extension_directories = [ "extensions/*" ]
name = "ShopifyApp"
application_url = "https://localhost/shop_admin_live"
embedded = true

[build]
include_config_on_deploy = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_content write_content read_themes write_themes read_products write_products read_product_listings read_customers write_customers read_orders write_orders read_draft_orders write_draft_orders read_inventory write_inventory read_locations read_script_tags write_script_tags read_fulfillments write_fulfillments read_shipping write_shipping read_analytics read_checkouts write_checkouts read_reports  write_reports read_price_rules write_price_rules read_marketing_events write_marketing_events read_resource_feedbacks write_resource_feedbacks read_shopify_payments_payouts unauthenticated_read_product_listings unauthenticated_write_checkouts unauthenticated_write_customers unauthenticated_read_content"

[auth]
redirect_urls = [ "https://localhost/shop/authorized/shopify_app" ]

[webhooks]
api_version = "2025-04"

  [webhooks.privacy_compliance]
  customer_deletion_url = "https://localhost/shopify/webhook"
  customer_data_request_url = "https://localhost/shopify/webhook"
  shop_deletion_url = "https://localhost/shopify/webhook"

[app_proxy]
url = "https://localhost/app_proxy"
subpath = "shopify-app"
prefix = "apps"

[pos]
embedded = false

[app_preferences]
url = "https://localhost/shop_admin_live/preferences"
